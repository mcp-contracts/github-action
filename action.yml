name: "MCP Contract Diff"
description: "Diff MCP server tool schemas against a baseline contract"
branding:
  icon: "shield"
  color: "blue"

inputs:
  baseline:
    description: >-
      Path to baseline snapshot (.mcpc.json). With 'config', a directory of
      baseline snapshots instead. Defaults to the 'baseline' from
      mcpcontracts.json, or contracts/baseline.mcpc.json.
    required: false
  command:
    description: "Server command to run via stdio (e.g., 'node dist/index.js')"
    required: false
  args:
    description: "Arguments for the server command (space-separated)"
    required: false
  url:
    description: "Server URL for streamable-http transport"
    required: false
  sse:
    description: "Use SSE transport instead of streamable-http (requires url)"
    required: false
    default: "false"
  headers:
    description: "Custom HTTP headers, one per line as 'Key: Value'"
    required: false
  config:
    description: >-
      Path to an mcp.json config. Enables composition mode: every server in
      the config is diffed against its baseline in the 'baseline' directory.
    required: false
  project:
    description: >-
      Path to mcpcontracts.json. When no transport inputs are given, the
      project config supplies the server and baseline (auto-discovered at
      the workspace root by default).
    required: false
  fail-on:
    description: "Severity threshold for failure: safe | warning | breaking (default: breaking, or the project config's failOn)"
    required: false
  check-conflicts:
    description: "Composition mode: detect duplicate tool names across servers and fail on conflicting schemas (true/false)"
    required: false
    default: "false"
  webhook:
    description: "URL to POST the diff report to as JSON (single-server mode)"
    required: false
  verify-signature:
    description: "Require valid signature on baseline before diffing (true/false)"
    required: false
    default: "false"
  signature-key:
    description: "Public key PEM content or file path for signature verification (falls back to MCP_SIGNATURE_KEY)"
    required: false
  comment-on-pr:
    description: "Post diff as a PR comment (true/false)"
    required: false
    default: "true"
  github-token:
    description: "GitHub token for PR comments (defaults to GITHUB_TOKEN)"
    required: false
    default: ${{ github.token }}

outputs:
  has-changes:
    description: "Whether any changes were detected (true/false)"
  has-breaking:
    description: "Whether breaking changes were detected (true/false)"
  has-conflicts:
    description: "Whether conflicting tool names were detected across servers (true/false)"
  summary:
    description: "JSON summary object with change counts"
  exit-code:
    description: "The exit code (0 = pass, 1 = fail)"

runs:
  using: "node20"
  main: "dist/index.js"
